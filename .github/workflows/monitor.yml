# Market hours: price alerts for your trades, stop losses, watchlist alerts, "zone touched",
# and replies to your Telegram commands. Light: only the needed stocks (one Yahoo request).
name: Market-hours monitor

on:
  schedule:
    - cron: "*/15 3-10 * * 1-5"   # every 15 min, 08:30–15:45 IST Mon–Fri (the tool itself only checks 09:15–15:30)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nsepattern-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: python -m nsepattern monitor
      - uses: ./.github/actions/save
        if: always()
