# Sunday: refresh the NSE stock list, industries, fundamentals and surveillance lists, rebuild everything.
# No Telegram alerts (markets are closed).
name: Weekly refresh

on:
  schedule:
    - cron: "30 0 * * 0"   # 06:00 IST, Sunday
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nsepattern-state
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          full-data: "true"
      - run: python -m nsepattern run --weekly
      - uses: ./.github/actions/save
        if: always()
        with:
          results: "true"
          data: "true"
      - name: Package the dashboard
        if: hashFiles('output/site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/site

  deploy:
    needs: refresh
    if: needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
