# Runs the automatic tests whenever the code changes (not on the scheduled state saves).
name: Tests

on:
  push:
    paths: ["nsepattern/**", "tests/**", "config.yaml", "requirements.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q
