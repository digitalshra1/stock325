<style>
:root{
  --bg:#f3f6fa; --bg2:#e7edf5; --card:#ffffff; --glass:rgba(255,255,255,.78); --ink:#0b1b2b; --muted:#5d6f84; --line:#e2e8f0; --soft:#f0f4f9;
  --accent:#0070d0; --accent2:#08b800; --accent-soft:#e7f1fc;
  --green:#0a9b2e; --green-bg:#e5f7e9; --amber:#a86f00; --amber-bg:#fff4d6; --red:#d93636; --red-bg:#fde8e8;
  --grey-bg:#edf1f6; --blue:#0070d0; --orange:#d98a00; --violet:#6d3fe0; --violet-bg:#f0eafe; --gold:#e8a800;
  --shadow:0 1px 2px rgba(1,24,40,.05),0 6px 24px rgba(1,24,40,.07); --shadow-h:0 2px 4px rgba(1,24,40,.07),0 12px 32px rgba(1,24,40,.12);
  --grad1:linear-gradient(135deg,#0a2540 0%,#0070d0 100%); --grad2:linear-gradient(135deg,#067a22 0%,#13c23a 100%);
  --grad3:linear-gradient(135deg,#d99400 0%,#e5533d 100%); --grad4:linear-gradient(135deg,#0070d0 0%,#00a6c7 100%);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06111d; --bg2:#0a1727; --card:#0c1a2b; --glass:rgba(12,26,43,.78); --ink:#e8eef6; --muted:#8fa1b6; --line:#1a2c42; --soft:#102238;
    --accent:#3d9bff; --accent2:#2fe04a; --accent-soft:#0f2a47;
    --green:#3fe05a; --green-bg:#0d2c18; --amber:#f5bb2c; --amber-bg:#30250a; --red:#ff7272; --red-bg:#3a1616;
    --grey-bg:#15263b; --blue:#3d9bff; --orange:#f5a524; --violet:#b69cff; --violet-bg:#241c3d; --gold:#f5bb2c;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 28px rgba(0,0,0,.3); --shadow-h:0 2px 6px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#06111d; --bg2:#0a1727; --card:#0c1a2b; --glass:rgba(12,26,43,.78); --ink:#e8eef6; --muted:#8fa1b6; --line:#1a2c42; --soft:#102238;
  --accent:#3d9bff; --accent2:#2fe04a; --accent-soft:#0f2a47;
  --green:#3fe05a; --green-bg:#0d2c18; --amber:#f5bb2c; --amber-bg:#30250a; --red:#ff7272; --red-bg:#3a1616;
  --grey-bg:#15263b; --blue:#3d9bff; --orange:#f5a524; --violet:#b69cff; --violet-bg:#241c3d; --gold:#f5bb2c;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 28px rgba(0,0,0,.3); --shadow-h:0 2px 6px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 100% -10%,color-mix(in srgb,var(--accent) 10%,transparent),transparent),var(--bg);min-height:100vh}
body,.card,header,.bnav,table th,input,select,button{transition:background-color .3s ease,color .3s ease,border-color .3s ease}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
/* header */
header{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);box-shadow:0 1px 0 var(--line),0 6px 20px rgba(1,24,40,.05)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2) 55%,var(--gold));opacity:.85}
:root{--hh:76px}
.bar{max-width:1360px;margin:0 auto;padding:0 20px;height:var(--hh);display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.brand{display:flex;align-items:center;flex:none;line-height:0;justify-self:start;border-radius:10px}
.brand:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.brand:hover{text-decoration:none}
.brand .lg{height:56px;width:auto;display:block;transition:transform .2s ease}
.brand:hover .lg{transform:scale(1.03)}
.brand .lg-d{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand .lg-l{display:none} :root:not([data-theme="light"]) .brand .lg-d{display:block} }
:root[data-theme="dark"] .brand .lg-l{display:none} :root[data-theme="dark"] .brand .lg-d{display:block}
#lock .brand{justify-content:center;margin-bottom:6px} #lock .brand .lg{height:72px}
nav.top{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--soft);border:1px solid var(--line);justify-self:center}
nav.top a{display:flex;gap:7px;align-items:center;padding:8px 13px;border-radius:10px;color:var(--muted);font-weight:600;font-size:13.5px;white-space:nowrap}
nav.top a:hover{background:var(--soft);color:var(--ink);text-decoration:none}
nav.top a.on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(1,24,40,.12),inset 0 -2px 0 var(--gold)}
.hright{justify-self:end;display:flex;gap:8px;align-items:center}
.iconbtn .i-sun{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .iconbtn .i-sun{display:inline} :root:not([data-theme="light"]) .iconbtn .i-moon{display:none} }
:root[data-theme="dark"] .iconbtn .i-sun{display:inline} :root[data-theme="dark"] .iconbtn .i-moon{display:none}
kbd{font:11px/1 Inter,system-ui;padding:3px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;color:var(--muted);background:var(--soft)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.sync{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);cursor:pointer;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--green)} .sync.warn .dot{background:var(--amber)} .sync.busy .dot{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
/* bottom nav (mobile) */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 0;border-radius:10px}
.bnav a.on{color:var(--accent)} .bnav a.on .ico{filter:drop-shadow(0 2px 0 var(--gold))} .bnav a:hover{text-decoration:none}
/* layout */
main{max-width:1360px;margin:0 auto;padding:20px}
h1{font-size:24px;letter-spacing:-.02em;margin:2px 0 4px;font-weight:800} h2{font-size:17px;margin:26px 0 12px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
h3{font-size:14.5px;margin:0 0 10px;font-weight:700}
.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.hov{transition:transform .18s ease,box-shadow .18s ease} .card.hov:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.g{display:grid;gap:14px}
.g.k4{grid-template-columns:repeat(4,minmax(0,1fr))} .g.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g.k3{grid-template-columns:repeat(3,minmax(0,1fr))} .g.cards3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.g>*{min-width:0}
@media (max-width:1100px){
  .g.k4,.g.k5,.g.k3,.g.cards3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g.k4>:last-child:nth-child(odd),.g.k5>:last-child:nth-child(odd),.g.k3>:last-child:nth-child(odd){grid-column:span 2}
}
@media (max-width:760px){ .g.two,.g.cards3{grid-template-columns:minmax(0,1fr)} .g.cards3>:last-child{grid-column:auto} }
.kpi{display:flex;flex-direction:column}
.kpi .l,.kpi .hd{min-height:20px;line-height:20px}
.kpi .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .hd .pill{line-height:16px}
.kpi .v{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v.txt{font-size:19px;line-height:1.3;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kpi .s{overflow:hidden;text-overflow:ellipsis}
.kpi .kr{display:flex;align-items:center;gap:12px;margin-top:6px}
.kpi .kr .s{margin:0}
.kpi .split{display:flex;gap:6px;align-items:baseline}
.kpi .split a{color:inherit;text-decoration:none;border-bottom:2px dotted transparent}
.kpi .split a:hover{border-bottom-color:currentColor}
.clk{cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.clk:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.card.clk:not(.gr):hover{border-color:var(--accent)}
.clk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.clk::after{content:"→";position:absolute;right:14px;bottom:10px;font-weight:700;opacity:0;transform:translateX(-4px);transition:all .18s ease}
.kpi.clk{position:relative} .kpi.clk:hover::after{opacity:.6;transform:none}
.chip{display:inline-flex;gap:10px;align-items:center;padding:6px 8px 6px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;margin:16px 0 0}
.chip a{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--card);color:var(--ink);font-weight:600;text-decoration:none}
.chip a:hover{color:var(--red)}
table{font-variant-numeric:tabular-nums}
th{vertical-align:bottom}
.mkt-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.nowrap{white-space:nowrap}
.kpi{position:relative;overflow:hidden}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.15}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.gr{color:#fff;border:none} .kpi.gr .l,.kpi.gr .s{color:rgba(255,255,255,.85)}
.gr1{background:var(--grad1)} .gr2{background:var(--grad2)} .gr3{background:var(--grad3)} .gr4{background:var(--grad4)}
.kpi.gr::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero{border-radius:20px;padding:20px;color:#fff;box-shadow:var(--shadow-h);align-self:start}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.03em}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.READY{background:var(--green-bg);color:var(--green)} .GETTING_CLOSE{background:var(--amber-bg);color:var(--amber)}
.FORMING{background:var(--grey-bg);color:var(--muted)} .DEEP{background:var(--red-bg);color:var(--red)}
.GOOD{background:var(--green-bg);color:var(--green)} .WEAK{background:var(--red-bg);color:var(--red)} .UNKNOWN{background:var(--grey-bg);color:var(--muted)}
.VCP_SETUP{background:var(--violet-bg);color:var(--violet)} .VCP_BREAKOUT{background:var(--grad1);color:#fff}
.Uptrend,.Bullish,.Positive{background:var(--green-bg);color:var(--green)} .Downtrend,.Bearish,.Negative{background:var(--red-bg);color:var(--red)}
.Sideways,.Neutral,.Flat{background:var(--grey-bg);color:var(--muted)}
.NORMAL{background:var(--green-bg);color:var(--green)} .CAUTION{background:var(--amber-bg);color:var(--amber)} .STRESSED{background:var(--red-bg);color:var(--red)}
.pos{color:var(--green)} .neg{color:var(--red)} .muted{color:var(--muted)} .small{font-size:12px} .b{font-weight:700}
.mood{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-radius:var(--r);padding:14px 16px;margin:14px 0}
.mood .m{font-weight:800;font-size:17px}
/* segmented tabs */
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg a{padding:7px 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg a.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)} .seg a:hover{text-decoration:none;color:var(--ink)}
.sticky{position:sticky;top:var(--hh);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:10px 0;margin:0 0 6px}
/* grid/table */
.tw{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
.tw.virt{max-height:680px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{position:sticky;top:0;z-index:2;background:var(--soft);font-weight:700;cursor:pointer;user-select:none;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
th:hover{color:var(--ink)} th.asc::after{content:" ▲";font-size:9px} th.desc::after{content:" ▼";font-size:9px}
tbody tr{transition:background .12s} tbody tr:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
tr:last-child td{border-bottom:none}
.virt tbody tr{height:58px} .virt td{overflow:hidden}
tr.hl td{background:var(--green-bg)} tr.hl2 td{background:color-mix(in srgb,var(--blue) 12%,transparent)}
td.num,th.num{text-align:right}
.sub{display:block;color:var(--muted);font-size:11px;font-weight:500}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* buttons and forms */
button,.btn{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;display:inline-flex;gap:6px;align-items:center;transition:transform .1s ease,background .2s,border-color .2s}
button:hover{border-color:var(--accent);color:var(--accent)} button:active{transform:scale(.97)}
button.primary{background:var(--grad1);color:#fff;border:none} button.primary:hover{color:#fff;filter:brightness(1.08)}
button.danger:hover{border-color:var(--red);color:var(--red)}
button.sm{padding:4px 8px;font-size:12px;border-radius:8px}
.star{border:none;background:none;padding:2px;color:var(--muted);font-size:18px;line-height:1;cursor:pointer}
.star.on{color:#f5b400} .star:hover{transform:scale(1.2)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}} .star.popping{animation:pop .3s ease}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.calc{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--soft)}
/* trade cards */
.tcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tcard .sym{font-size:17px;font-weight:800}
.tcard .pl{font-size:22px;font-weight:800;text-align:right}
.track{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--red-bg),var(--grey-bg) 40%,var(--green-bg));margin:18px 0 6px}
.track .mk{position:absolute;top:-5px;width:4px;height:18px;border-radius:3px;background:var(--ink);transform:translateX(-2px);transition:left .5s ease}
.track .en{position:absolute;top:-3px;width:2px;height:14px;background:var(--muted)}
.tl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px} .kv>div:nth-child(odd){color:var(--muted)}
.checks{padding:0;margin:0;list-style:none} .checks li{margin:6px 0}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px;border-radius:2px}
.banner{padding:10px 14px;border-radius:12px;margin-bottom:12px;font-weight:600;font-size:13px}
.banner.demo{background:var(--amber-bg);color:var(--amber)} .banner.unlocked{background:var(--red-bg);color:var(--red)} .banner.info{background:var(--accent-soft);color:var(--accent)}
.distbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft);min-width:90px}
.distbar span{display:block;height:100%}
.meter{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;min-width:70px} .meter span{display:block;height:100%;background:var(--grad1);border-radius:99px}
.hit{background:var(--green-bg);color:var(--green);text-align:center} .miss{color:var(--muted);text-align:center}
details>summary{cursor:pointer;font-weight:700;margin:16px 0 10px;list-style:none;display:flex;gap:8px;align-items:center}
details>summary::before{content:"›";display:inline-block;transition:transform .2s;font-size:18px;color:var(--muted)}
details[open]>summary::before{transform:rotate(90deg)}
.red{color:var(--red);font-weight:600} .flagline{color:var(--red);font-size:11.5px}
footer{max-width:1360px;margin:24px auto 0;padding:18px 20px 90px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
/* hover definitions */
#tip{position:fixed;z-index:80;max-width:320px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:10px;font:500 12.5px/1.5 Inter,system-ui,sans-serif;text-transform:none;letter-spacing:0;box-shadow:var(--shadow-h);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease}
#tip.on{opacity:1;transform:none}
.ti{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1.3px solid currentColor;font:700 9px/1 Inter,system-ui;margin-left:5px;opacity:.5;cursor:help;text-transform:none;vertical-align:1px;font-style:normal}
[data-tip]:hover>.ti,.ti:hover{opacity:1;color:var(--accent)}
.flag{display:inline-block;width:22px;height:15px;border-radius:3px;overflow:hidden;vertical-align:-3px;box-shadow:0 0 0 1px var(--line);flex:none}
.flag svg{display:block;width:100%;height:100%}
.region{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px;margin-top:8px}
/* skeleton */
.sk{background:linear-gradient(90deg,var(--soft) 25%,var(--bg2) 50%,var(--soft) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
/* toast */
#toasts{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:var(--shadow-h);animation:tin .25s ease}
.toast.err{background:var(--red);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.fade{animation:fin .25s ease} @keyframes fin{from{opacity:0;transform:translateY(4px)}}

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
"use strict";
/* ============================== basics ============================== */
const P = JSON.parse(document.getElementById("payload").textContent);
let D = null, CFG = null, PW = null, X = {};           // X = add-on extras (VCP, global, industries, quotes)
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NA = '<span class="muted">N/A</span>';
const nf2 = new Intl.NumberFormat("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat("en-IN",{maximumFractionDigits:0});
const rs = x => x==null||isNaN(x) ? NA : (x<0?"-":"")+"₹"+nf2.format(Math.abs(x));
const rs0 = x => x==null||isNaN(x) ? NA : (x<0?"-":"")+"₹"+nf0.format(Math.abs(x));
const pct = (x,d=2) => x==null||isNaN(x) ? NA : `<span class="${x>0?"pos":x<0?"neg":""}">${x>0?"+":""}${(+x).toFixed(d)}%</span>`;
const pctTxt = (x,d=2) => x==null||isNaN(x) ? "N/A" : `${x>0?"+":""}${(+x).toFixed(d)}%`;
const num = (x,d=1) => x==null||isNaN(x) ? NA : Number(x).toFixed(d);
const signRs = x => x==null ? NA : `<span class="${x>0?"pos":x<0?"neg":""}">${x>0?"+":""}${rs(x)}</span>`;
function crore(x){ if(x==null) return NA; const cr=x/1e7; return cr>=1e5 ? "₹"+nf2.format(cr/1e5)+" lakh cr" : "₹"+nf0.format(cr)+" cr"; }
const pc = s => (s||"").replace(/ /g,"_");
const pill = s => s ? `<span class="pill ${pc(s)}">${esc(s)}</span>` : NA;
const ico = n => `<svg class="ico"><use href="#i-${n}"/></svg>`;
const ICON = {PASS:"✅",WARN:"⚠️",FAIL:"❌",NA:"➖"};
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }; // local (IST) date
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(msg, err){ const t=document.createElement("div"); t.className="toast"+(err?" err":""); t.textContent=msg; $("#toasts").appendChild(t); setTimeout(()=>t.remove(), err?5000:2200); }
const hr = st => (!st || st.hit_rate==null) ? NA : `${Math.round(st.hit_rate*100)}% <span class="sub">${st.hits}/${st.trades} trades</span>`;

/* ============================== crypto (same format as Python) ============================== */
/* CRYPTO-START */
function b64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
function toB64(u8){ let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
const KEYS = {};
async function keyFor(pw, saltB64, iter){
  const k = pw+"|"+saltB64+"|"+iter; if(KEYS[k]) return KEYS[k];  // cache per password+salt (never reuse across passwords)
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  KEYS[k] = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(saltB64), iterations:iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  return KEYS[k];
}
async function decrypt(env, pw){
  const key = await keyFor(pw, env.salt, env.iter);
  let pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(env.iv)}, key, b64(env.ct));
  if(env.z === "gzip") pt = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  return JSON.parse(new TextDecoder().decode(pt));
}
async function encrypt(obj, pw, saltB64){
  const salt = saltB64 || toB64(crypto.getRandomValues(new Uint8Array(16))), iter = 250000;
  const key = await keyFor(pw, salt, iter), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  return {v:1, kdf:"PBKDF2-SHA256", iter, salt, iv:toB64(iv), ct:toB64(ct)};
}
/* CRYPTO-END */
window.__decrypt = decrypt; window.__encrypt = encrypt; // used by the Python/JS compatibility tests

/* ============================== storage: watchlist, trades, alerts ============================== */
const Store = {
  mode:"none", state:null, salt:null, sha:null, note:"",
  empty(){ return {version:1, watchlist:[], alerts:[], trades:[], fired:[], settings:{capital:0}, updated:null}; },
  normal(s){ const e=this.empty(); const o=Object.assign(e, s||{}, {settings:Object.assign(e.settings,(s||{}).settings||{})});
    let n=Math.max(0,...o.trades.map(t=>t.no||0)); o.trades.slice().sort((a,b)=>(a.created||"").localeCompare(b.created||"")).forEach(t=>{ if(!t.no) t.no=++n; }); return o; },
  setSync(cls, txt){ const el=$("#sync"); el.className="sync "+cls; el.querySelector(".lbl").textContent=txt; el.title=this.note||txt; },
  ghCfg(){ let t=null, r=null; try{ t=localStorage.getItem("sp_gh_token"); r=localStorage.getItem("sp_gh_repo"); }catch(e){}
    return {token:t, repo:r || D.repo?.name, branch:D.repo?.branch||"main", path:CFG.state_file}; },
  async init(){
    this.state = this.empty();
    if(D.demo){ this.mode="demo"; try{ this.state=this.normal(JSON.parse(localStorage.getItem("sp_demo_state")||"null")); }catch(e){}
      this.note="Demo: saved in this browser only"; return this.setSync("warn","Demo data"); }
    if(location.protocol.startsWith("http")){
      try { const r = await fetch("api/ping", {cache:"no-store"}); if(r.ok && (await r.json()).mode==="local"){
        if(!PW){ this.mode="browser"; this.note="Set a password (.app_password) to save to your PC; using this browser for now."; }
        else { this.mode="local"; const s = await fetch("api/state",{cache:"no-store"});
          if(s.ok){ const env=await s.json(); this.salt=env.salt; this.state=this.normal(await decrypt(env, PW)); }
          this.note="Saved (encrypted) on this PC: "+CFG.state_file; return this.setSync("ok","Saved on PC"); } } } catch(e){}
    }
    const gh = this.ghCfg();
    if(PW && gh.token && gh.repo){
      try { await this.ghLoad(); this.mode="github"; this.note=`Synced (encrypted) to ${gh.repo}`; return this.setSync("ok","Synced"); }
      catch(e){ this.note="GitHub sync failed: "+e.message; toast("GitHub sync failed: "+e.message, true); }
    }
    this.mode="browser";
    try{ const raw=localStorage.getItem("sp_state"); if(raw){ const o=JSON.parse(raw); this.state=this.normal(o.ct&&PW?await decrypt(o,PW):o); if(o.salt) this.salt=o.salt; } }catch(e){}
    this.note = this.note || (D.repo?.name||gh.repo ? "Saved in this browser only. Add a GitHub token in Settings to sync." : "Saved in this browser only.");
    this.setSync("warn","This browser");
  },
  async ghLoad(){
    const g=this.ghCfg();
    const r = await fetch(`https://api.github.com/repos/${g.repo}/contents/${g.path}?ref=${encodeURIComponent(g.branch)}`,
      {headers:{Authorization:"Bearer "+g.token, Accept:"application/vnd.github+json"}, cache:"no-store"});
    if(r.status===404){ this.sha=null; return; }
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json(); this.sha=j.sha;
    const env = JSON.parse(new TextDecoder().decode(b64(j.content.replace(/\n/g,""))));
    this.salt=env.salt; this.state=this.normal(await decrypt(env, PW));
  },
  async ghSave(env){
    const g=this.ghCfg();
    const body={message:"Update watchlist/trades from dashboard", branch:g.branch,
      content:toB64(new TextEncoder().encode(JSON.stringify(env)))};
    if(this.sha) body.sha=this.sha;
    const r = await fetch(`https://api.github.com/repos/${g.repo}/contents/${g.path}`,
      {method:"PUT", headers:{Authorization:"Bearer "+g.token, Accept:"application/vnd.github+json"}, body:JSON.stringify(body)});
    if(r.status===409||r.status===422) { const e=new Error("conflict"); e.conflict=true; throw e; }
    if(!r.ok) throw new Error("HTTP "+r.status);
    this.sha=(await r.json()).content.sha;
  },
  async persist(){
    this.state.updated=new Date().toISOString();
    if(this.mode==="demo"){ try{ localStorage.setItem("sp_demo_state", JSON.stringify(this.state)); }catch(e){} return; }
    const env = PW ? await encrypt(this.state, PW, this.salt) : this.state;
    if(PW) this.salt=env.salt;
    if(this.mode==="local"){ const r=await fetch("api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(env)}); if(!r.ok) throw new Error("HTTP "+r.status); return; }
    if(this.mode==="github") return this.ghSave(env);
    try{ localStorage.setItem("sp_state", JSON.stringify(env)); }catch(e){ throw new Error("browser storage blocked"); }
  },
  async mutate(fn, okMsg){
    fn(this.state); if(okMsg) toast(okMsg); softRender();
    this.setSync("busy","Saving…");
    try { await this.persist(); }
    catch(e){
      if(e.conflict){ try{ await this.ghLoad(); fn(this.state); await this.persist(); softRender(); }
        catch(e2){ this.setSync("warn","Not saved"); return toast("Could not save: "+e2.message, true); } }
      else { this.setSync("warn","Not saved"); return toast("Could not save: "+e.message, true); }
    }
    this.setSync(this.mode==="browser"||this.mode==="demo"?"warn":"ok", {local:"Saved on PC",github:"Synced",browser:"This browser",demo:"Demo data"}[this.mode]);
  },
};
const inWL = s => Store.state.watchlist.some(w => w.symbol===s);
function toggleWL(sym, btn){
  if(btn){ btn.classList.add("popping"); setTimeout(()=>btn.classList.remove("popping"),300); }
  if(inWL(sym)) Store.mutate(s => { s.watchlist = s.watchlist.filter(w=>w.symbol!==sym); }, `${sym} removed from watchlist`);
  else Store.mutate(s => { s.watchlist.push({symbol:sym, added:today(), note:""}); }, `★ ${sym} added to watchlist`);
}

/* ============================== prices (LTP) ============================== */
const Q = { live:{},
  get(sym){ const L=this.live[sym], e=X.quotes?.[sym], a=D.stocks[sym];
    const base = e ? {ltp:e.ltp, chg:e.chg_1d, date:e.date} : a ? {ltp:a.last_close, chg:a.ret_1d, date:a.last_date} : null;
    if(L && base){ const prev = base.ltp/(1+(base.chg||0)/100); const sameDay = L.time && L.time.slice(0,10)===base.date;
      return {ltp:L.ltp, chg: sameDay ? (L.ltp/prev-1)*100 : (L.ltp/base.ltp-1)*100, live:true, time:L.time}; }
    if(L) return {ltp:L.ltp, chg:null, live:true, time:L.time};
    return base; },
  spark(sym){ return X.quotes?.[sym]?.spark || (D.stocks[sym]?.chart?.c||[]).slice(-30); },
};
async function refreshLive(){
  if(Store.mode!=="local") return;
  const syms = new Set([...Store.state.watchlist.map(w=>w.symbol), ...Store.state.trades.filter(t=>t.status==="open").map(t=>t.symbol)]);
  byStatus("READY").concat(byStatus("GETTING CLOSE")).forEach(a=>syms.add(a.symbol));
  if(!syms.size) return;
  try{ const r = await fetch("api/quotes?s="+[...syms].slice(0,150).join(","),{cache:"no-store"}); if(!r.ok) return;
    Object.assign(Q.live, await r.json());
    document.querySelectorAll("[data-ltp]").forEach(el => { const q=Q.get(el.dataset.ltp); if(q) el.innerHTML=ltpHtml(q); });
    if(["/trades","/analytics"].includes(route().path) && !document.activeElement?.matches("input,select,textarea")) render(true);
  }catch(e){}
}
const ltpHtml = q => `<b>${rs(q.ltp)}</b><span class="sub">${q.chg==null?"":pctTxt(q.chg)}${q.live?' · <span class="pos">live</span>':""}</span>`;
const ltpCell = sym => { const q=Q.get(sym); return `<span data-ltp="${esc(sym)}">${q?ltpHtml(q):NA}</span>`; };

/* ============================== lazy stock details ============================== */
const DET = {loaded:{}, pending:{}};
async function loadDetails(sym){
  const a = D.stocks[sym], v = X.vcp?.[sym]; if(!D.details_split || ((!a || a._det) && (!v || v._det))) return;
  const b = a?._b || v?._b; if(!b) return;
  const holder = a || v;
  if(!DET.loaded[b]){
    DET.pending[b] ||= (async () => { const r = await fetch(`details/${b}.json`); if(!r.ok) throw new Error("HTTP "+r.status);
      const p = await r.json(); DET.loaded[b] = p.locked ? await decrypt(p.env, PW) : p.data; })();
    try { await DET.pending[b]; } catch(e){ DET.pending[b]=null; holder._detErr = location.protocol==="file:" ? "Open the dashboard through the local server (python -m nsepattern serve) to see charts and trade history." : "Could not load details: "+e.message; return; }
  }
  const det = DET.loaded[b][sym]; if(!det) return;
  if(v && det.vcp){ if(det.vcp.conditions) v.conditions = det.vcp.conditions; if(det.vcp.history_trades && v.history) v.history.trades = det.vcp.history_trades; v._det = true; }
  if(!a) return;
  for(const k of ["chart","sheet","deals","bounce_lows","fundamentals","shareholding"]) if(det[k]!==undefined) a[k]=det[k];
  if(det.depths_pct) a.profile.depths_pct = det.depths_pct;
  if(det.news) a.news = det.news;
  Object.assign(a.backtest, det.backtest||{}); a._det = true;
}

function grid(cols, rows, opt={}){

/* ============================== charts ============================== */
function spark(v, w=88, h=26){
  if(!v || v.length<2) return "";
  const lo=Math.min(...v), hi=Math.max(...v), r=hi-lo||1, col = v[v.length-1]>=v[0]?"var(--green)":"var(--red)";
  const pts = v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-2-(y-lo)/r*(h-4)).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function ring(p, label, size=92, col="var(--accent)"){
  const r=size/2-8, c=2*Math.PI*r, v = p==null?0:Math.max(0,Math.min(100,p));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)} ${p==null?"N/A":v.toFixed(0)+"%"}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--soft)" stroke-width="8" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${col}" stroke-width="8" fill="none" stroke-linecap="round"
      stroke-dasharray="${(c*v/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dasharray .8s ease"/>
    <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-weight="800" font-size="${Math.max(13,size/4.6)}" fill="var(--ink)">${p==null?"–":v.toFixed(0)+"%"}</text></svg>`;
}
function vbars(items, opt={}){ // [{label, value}] vertical bars, signed
  if(!items.length) return `<div class="muted small">No data yet.</div>`;
  const W=Math.max(420, items.length*44), H=opt.h||220, B=28, T=16;
  const mx=Math.max(...items.map(i=>Math.abs(i.value)),1e-9), hasNeg=items.some(i=>i.value<0);
  const zero = hasNeg ? T+(H-T-B)/2 : H-B, scale = hasNeg ? (H-T-B)/2/mx : (H-T-B)/mx, bw=W/items.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||"bar chart")}"><line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--line)"/>`;
  items.forEach((it,i)=>{ const h=Math.abs(it.value)*scale, y=it.value>=0?zero-h:zero, col=it.color||(it.value>=0?"var(--green)":"var(--red)");
    const bwid=Math.min(bw*.64, 46); s+=`<rect x="${i*bw+(bw-bwid)/2}" y="${y}" width="${bwid}" height="${Math.max(1,h)}" rx="4" fill="${col}" opacity=".9"><title>${esc(it.label)}: ${esc(opt.fmt?opt.fmt(it.value):it.value)}</title></rect>`;
    s+=`<text x="${i*bw+bw/2}" y="${it.value>=0?y-4:y+h+12}" font-size="10" text-anchor="middle" fill="var(--ink)">${esc(opt.fmt?opt.fmt(it.value):Math.round(it.value))}</text>`;
    s+=`<text x="${i*bw+bw/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${esc(it.label)}</text>`; });
  return `<div class="chart" style="overflow-x:auto">${s}</svg></div>`;
}
function hbars(items, opt={}){ // [{label, value(0-100)}]
  return `<div style="display:grid;gap:8px">${items.map(it=>`<div style="display:grid;grid-template-columns:minmax(90px,150px) 1fr 52px;gap:10px;align-items:center;font-size:12.5px">
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(it.label)}">${esc(it.label)}</span>
    <div class="meter" style="height:9px"><span style="width:${Math.max(0,Math.min(100,it.value)).toFixed(1)}%;${it.color?"background:"+it.color:""}"></span></div>
    <b style="text-align:right">${opt.fmt?opt.fmt(it.value):it.value.toFixed(0)+"%"}</b></div>`).join("")}</div>`;
}
function lineChart(series, opt={}){ // series: [{name, color, pts:[{x:label, y}]}]
  const all = series.flatMap(s=>s.pts.map(p=>p.y)).filter(v=>v!=null);
  if(all.length<2) return `<div class="muted small">Not enough data yet.</div>`;
  const W=opt.w||480,H=opt.h||240,L=8,R=62,T=12,B=24, n=Math.max(...series.map(s=>s.pts.length));
  let lo=opt.min??Math.min(...all), hi=opt.max??Math.max(...all); if(hi===lo){hi+=1;lo-=1;}
  const x=i=>L+i*(W-L-R)/Math.max(1,n-1), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||"line chart")}">`;
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4; s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${W-R+6}" y="${y(v)+4}" font-size="10" fill="var(--muted)">${esc(opt.fmt?opt.fmt(v):v.toFixed(2))}</text>`; }
  if(opt.zero && lo<0 && hi>0) s+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  series.forEach(se=>{ const d=se.pts.map((p,i)=>p.y==null?"":`${i&&se.pts[i-1].y!=null?"L":"M"}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join("");
    if(opt.area && series.length===1) s+=`<path d="${d} L${x(se.pts.length-1)},${H-B} L${x(0)},${H-B}Z" fill="${se.color}" opacity=".12"/>`;
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2"/>`; });
  const p0=series[0].pts; [0,Math.floor(n/2),n-1].forEach(i=>{ if(p0[i]) s+=`<text x="${x(i)}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="middle">${esc(p0[i].x)}</text>`; });
  s+="</svg>";
  return `<div class="chart">${s}${series.length>1?`<div class="legend">${series.map(se=>`<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join("")}</div>`:""}</div>`;
}
const DISTC = {"READY":"var(--green)","GETTING CLOSE":"var(--amber)","FORMING":"#94a3b8","DEEP":"var(--red)","VCP SETUP":"var(--violet)","VCP BREAKOUT":"var(--accent)"};
function distBar(dist){ const t=Object.values(dist||{}).reduce((a,b)=>a+b,0); if(!t) return '<span class="muted small">–</span>';

function staleBanner(){
  // the latest trading day whose evening scan should exist by now (IST): weekdays after 19:30, else the previous weekday
  if(!D.data_date || D.demo) return "";
  const now = new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Kolkata"}));
  const exp = new Date(now); if(now.getHours()*60+now.getMinutes() < 19*60+30) exp.setDate(exp.getDate()-1);
  while(exp.getDay()===0 || exp.getDay()===6) exp.setDate(exp.getDate()-1);
  const d = new Date(D.data_date+"T00:00:00"); let gap=0; const c=new Date(d);
  while(c < exp){ c.setDate(c.getDate()+1); if(c.getDay()!==0 && c.getDay()!==6) gap++; }
  if(gap < 1) return "";
  const nice = d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
  return `<div class="banner demo">⚠ This data is from ${nice}. ${gap===1?"Today's scan hasn't finished yet, or the market was closed (holiday).":`It is ${gap} trading days old: the daily scan may be failing (check the Actions tab on GitHub).`}</div>`;
}

function tradeSummary(){ // shared by dashboard + trades
  const st = Store.state, open = st.trades.filter(t=>t.status==="open"), closed = st.trades.filter(t=>t.status==="closed");
  const now = new Date(), d0 = today();
  const wk = new Date(now); wk.setDate(now.getDate()-((now.getDay()+6)%7));
  const wkS = `${wk.getFullYear()}-${String(wk.getMonth()+1).padStart(2,"0")}-${String(wk.getDate()).padStart(2,"0")}`; // Monday, local date
  const mS = d0.slice(0,7)+"-01", yS = d0.slice(0,4)+"-01-01";
  let invested=0, unreal=0, todayPL=0, risk=0, noStop=0;
  open.forEach(t => { const q=Q.get(t.symbol), ltp=q?.ltp ?? t.entry; invested+=t.entry*t.qty; unreal+=(ltp-t.entry)*t.qty;
    if(t.date===d0) todayPL += (ltp-t.entry)*t.qty;
    else if(q && q.chg!=null){ const prev=ltp/(1+q.chg/100); todayPL += (ltp-prev)*t.qty; }
    if(t.stop) risk += Math.max(0, ltp-t.stop)*t.qty; else noStop++; });
  const pl = t => (t.exit_price - t.entry)*t.qty;
  const realisedSince = s => closed.filter(t=>t.exit_date>=s).reduce((a,t)=>a+pl(t),0);
  todayPL += realisedSince(d0);
  const wins = closed.filter(t=>pl(t)>0).length;
  const deployed = st.trades.reduce((a,t)=>a+t.entry*t.qty,0);
  const realised = closed.reduce((a,t)=>a+pl(t),0);
  const monthBought = st.trades.filter(t=>(t.date||"")>=mS).length;
  return {open, closed, invested, unreal, todayPL, week:realisedSince(wkS), month:realisedSince(mS), year:realisedSince(yS),
    realised, overall: deployed? (realised+unreal)/deployed*100 : null, risk, riskPct: invested? risk/invested*100 : null, noStop,
    success: closed.length? wins/closed.length*100 : null, wins, monthBought};
}

function fallbackIndustries(){
  const by={}; stocks().filter(isMain).forEach(a=>{ const r=by[a.industry] ||= {industry:a.industry,stocks:0,matching:0,distribution:{},hits:[]};

    if(a.backtest.best?.hit_rate!=null) r.hits.push(a.backtest.best.hit_rate*100); });
  return Object.values(by).map(r=>({...r, avg_win_rate:r.hits.length?r.hits.reduce((a,b)=>a+b,0)/r.hits.length:null})).sort((a,b)=>b.stocks-a.stocks);
}

    return `<div class="card hov"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="row" style="flex-wrap:nowrap;gap:8px;min-width:0">${flag(s.flag)}<div style="min-width:0"><b class="mkt-name">${esc(n)}</b><span class="sub mkt-name">${esc(s.country||"")}</span></div></div>${pill(s.trend)}</div>
     <div class="row" style="justify-content:space-between;margin-top:8px"><div><div style="font-size:20px;font-weight:800">${nf2.format(s.last)}</div>${pct(s.chg_1d)} <span class="small muted">${s.complete?"today":"so far"}</span></div>${spark(s.spark)}</div>
     <div class="small nowrap" style="margin-top:6px">1w ${pct(s.chg_1w)} · 1m ${pct(s.chg_1m)} · vol ${num(s.volatility_pct,0)}%${ti("Volatility: how much it swings day to day over the last 20 days, scaled to a yearly %.")}</div>
     <div class="sub" style="margin-top:2px">${s.complete?`Session closed ${esc(s.close_ist||"")}`:`<span class="pos">Live</span> · closes ${esc(s.close_ist||"")}`}</div></div>`; }).join("") + `</div>`;
  h += `<h2>Correlation engine${ti("Based on the last 3 years. For each Indian session, a market's last session that closed before India opened is compared with what NIFTY did.")}</h2>`;
  h += grid([
    {h:"Market", v:r=>r.n, f:r=>`<div class="row" style="flex-wrap:nowrap;gap:8px">${flag(sn[r.n].flag)}<b>${esc(r.n)}</b></div>`},
    {h:"Country", v:r=>sn[r.n].country, f:r=>esc(sn[r.n].country||"")},
    {h:"Last closed move", num:1, v:r=>mv(r.n), f:r=>pct(mv(r.n))},
    {h:"Up → NIFTY up", num:1, v:r=>r.up_then_up, f:r=>`<b>${num(r.up_then_up,0)}%</b><span class="sub">${r.up_days} days · conf ${r.up_conf==null?"N/A":num(r.up_conf,0)+"%"}</span>`},
    {h:"Down → NIFTY down", num:1, v:r=>r.down_then_down, f:r=>`<b>${num(r.down_then_down,0)}%</b><span class="sub">${r.down_days} days · conf ${r.down_conf==null?"N/A":num(r.down_conf,0)+"%"}</span>`},
    {h:"Up → gap up", num:1, v:r=>r.up_then_gap_up, f:r=>num(r.up_then_gap_up,0)+"%"},
    {h:"Correlation (day)", num:1, v:r=>r.corr_day, f:r=>`<b>${num(r.corr_day*100,0)}%</b>`},
    {h:"Correlation (open)", num:1, v:r=>r.corr_gap, f:r=>num(r.corr_gap*100,0)+"%"},
  ], linked.map(n=>({n, ...rel[n]})).sort((a,b)=>b.corr_gap-a.corr_gap));
  const sel = q.get("m") && rel[q.get("m")]?.available ? q.get("m") : linked[0];
  const rc = rel[sel]?.rolling_corr;
  if(q.get("m")) scrollToId("rollcorr");
  h += `<div class="g two" style="margin-top:14px"><div class="card" id="rollcorr"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Rolling correlation with NIFTY${ti("60-day correlation between this market's move and NIFTY's next-day move, month by month. Rising = the link is getting stronger.")}</h3>
    <select onchange="location.hash='#/global?m='+encodeURIComponent(this.value)">${linked.map(n=>`<option ${n===sel?"selected":""}>${esc(n)}</option>`).join("")}</select></div>
    ${rc?lineChart([{name:sel,color:"var(--accent)",pts:rc.d.map((d,i)=>({x:d.slice(0,7),y:rc.v[i]}))}],{zero:true,area:true,fmt:v=>(v*100).toFixed(0)+"%",label:"rolling correlation"}):NA}</div>
    <div class="card"><h3>When the market rose, NIFTY opened higher…${ti("Share of times NIFTY opened higher in the next session after each market closed higher (last 3 years).")}</h3>${hbars(linked.slice().sort((a,b)=>rel[b].up_then_gap_up-rel[a].up_then_gap_up).map(n=>({label:n, value:rel[n].up_then_gap_up})))}</div></div>`;
  return h;
}

/* ============================== pages: watchlist ============================== */
function pageWatchlist(q){
  const wl = Store.state.watchlist, al = Store.state.alerts, pre = q.get("alert");

  const rows = wl.map(symRow);
  let h = `<h1>Watchlist</h1><p class="lead">${wl.length} stocks · ${al.filter(a=>a.active!==false).length} active alerts</p>`;
  h += `<div class="card" id="af"><h3>${ico("bell")} New price alert</h3><form class="form" id="alertForm">
      <label>Stock<input name="symbol" list="syms" required value="${esc(pre||"")}" placeholder="e.g. TATASTEEL" autocomplete="off"></label>
      <label>When price goes<select name="kind"><option value="below">Below</option><option value="above">Above</option></select></label>
      <label>Price (₹)<input name="price" type="number" step="any" min="0" required></label>
      <label>Note<input name="note" placeholder="optional"></label>
      <label>&nbsp;<button class="primary" type="submit">${ico("plus")}Add alert</button></label></form>
      <div class="small muted" id="alertHint" style="margin-top:8px"></div></div>`;
  h += `<h2>Stocks</h2>` + grid([
    {h:"", f:r=>starBtn(r.symbol)},
    {h:"Stock", v:r=>r.symbol, f:r=>stockLink(r.symbol)},
    C.ltp, C.spark,
    {h:"Streak status", v:r=>r.a.status?.status, f:r=>r.a.status?.status?pill(r.a.status.status):'<span class="muted">–</span>'},
    {h:"VCP", v:r=>r.v?.status, f:r=>r.v?.status?pill(r.v.status):'<span class="muted">–</span>'},
    {h:"Buy (best tested)", num:1, v:r=>r.a.status?.best?.buy_price, f:r=>r.a.status?.best?rs(r.a.status.best.buy_price):'<span class="muted">–</span>'},
    {h:"Alerts", num:1, v:r=>al.filter(a=>a.symbol===r.symbol&&a.active!==false).length, f:r=>{const n=al.filter(a=>a.symbol===r.symbol&&a.active!==false).length; return n?`<span class="pill CAUTION">${ico("bell")} ${n}</span>`:"";}},
    {h:"Added", v:r=>r.added, f:r=>esc(r.added||"")},
    {h:"", f:r=>`<div class="row" style="flex-wrap:nowrap"><button class="sm" data-act="alert" data-sym="${esc(r.symbol)}">${ico("bell")}Alert</button><button class="sm" data-act="trade" data-sym="${esc(r.symbol)}">${ico("plus")}Trade</button>${D.stocks[r.symbol]?`<button class="sm" data-act="hits" data-sym="${esc(r.symbol)}">View hit rate</button>`:""}</div>`},
  ], rows, {empty:"Your watchlist is empty. Tap ☆ next to any stock to add it."});
  const act = al.filter(a=>a.active!==false), done = al.filter(a=>a.active===false);
  const acols = [
    {h:"Stock", v:a=>a.symbol, f:a=>stockLink(a.symbol)}, C.ltp,
    {h:"Condition", v:a=>a.price, f:a=>`${a.kind==="above"?"⬆ Above":"⬇ Below"} <b>${rs(a.price)}</b>`},
    {h:"Distance", num:1, v:a=>{const q=Q.get(a.symbol); return q?(a.price/q.ltp-1)*100:null;}, f:a=>{const q=Q.get(a.symbol); return q?pctTxt((a.price/q.ltp-1)*100):NA;}},
    {h:"Note", f:a=>esc(a.note||"")},
    {h:"Status", tip:"Active = waiting. Triggered = the price reached it and the alert was sent once.", v:a=>a.active!==false?0:1, f:a=>a.active!==false?'<span class="pill CAUTION">Active</span>':`<span class="pill GOOD">Triggered</span><span class="sub">${esc(a.triggered_at||"")} at ${rs(a.triggered_price)}</span>`},
    {h:"", f:a=>`<button class="sm danger" data-act="rm-alert" data-id="${esc(a.id)}">${ico("x")}</button>`},
  ];
  h += `<h2>${ico("bell")} Alerts</h2>` + grid(acols, [...act, ...done], {empty:"No alerts yet."});
  AFTER.push(() => {
    const f = $("#alertForm"); if(!f) return;
    const hint = () => { const s=f.symbol.value.trim().toUpperCase(), q=Q.get(s); $("#alertHint").innerHTML = q?`${esc(s)} last price ${rs(q.ltp)}`:""; if(q && !f.price.value) f.price.placeholder = q.ltp.toFixed(2); };
    f.symbol.addEventListener("input", hint); hint();
    if(pre){ f.price.focus(); $("#af").scrollIntoView({behavior:"smooth", block:"center"}); }
    f.onsubmit = ev => { ev.preventDefault(); document.activeElement?.blur(); const s=f.symbol.value.trim().toUpperCase().replace(/\.NS$/,""), p=+f.price.value;
      if(!s || !(p>0)) return toast("Enter a stock and a price", true);
      Store.mutate(st => { st.alerts.push({id:uid(), symbol:s, kind:f.kind.value, price:p, note:f.note.value.trim(), created:new Date().toISOString(), active:true});
        if(!st.watchlist.some(w=>w.symbol===s)) st.watchlist.push({symbol:s, added:today(), note:""}); }, `🔔 Alert set: ${s} ${f.kind.value} ₹${p}`);
      if(pre) history.replaceState(null,"","#/watchlist"); };
  });
  return h;
}

/* ============================== pages: trades ============================== */
function tradeCard(t){
  const q = Q.get(t.symbol), ltp = q?.ltp ?? null, pl = ltp!=null?(ltp-t.entry)*t.qty:null, plp = ltp!=null?(ltp/t.entry-1)*100:null;
  const days = Math.max(0, Math.round((Date.now()-new Date(t.date))/864e5));
  const lo = t.stop || t.entry*0.95, hi = t.target || t.entry*(1+CFG.target/100);
  const posPct = v => Math.max(0, Math.min(100, (v-lo)/(hi-lo)*100));
  const riskRs = t.stop ? (t.entry-t.stop)*t.qty : null, rewRs = t.target ? (t.target-t.entry)*t.qty : null;
  const rr = riskRs>0 && rewRs ? rewRs/riskRs : null;
  const closing = UI.closing===t.id;
  return `<div class="card tcard hov"><div class="top"><div><div class="sym"><a href="#/stock/${encodeURIComponent(t.symbol)}">${esc(t.symbol)}</a> <span class="muted" style="font-size:13px;font-weight:600">#${t.no??""}</span></div>
      <div class="small muted">${esc(t.strategy||"Trade")} · ${t.qty} @ ${rs(t.entry)} · ${days}d held</div></div>
      <div><div class="pl ${pl>0?"pos":pl<0?"neg":""}">${pl==null?NA:(pl>0?"+":"")+rs0(pl)}</div><div class="small" style="text-align:right">${pct(plp)} · <span data-ltp="${esc(t.symbol)}">${q?ltpHtml(q):NA}</span></div></div></div>
    <div class="track"><span class="en" style="left:${posPct(t.entry)}%"></span>${ltp!=null?`<span class="mk" style="left:${posPct(ltp)}%"></span>`:""}</div>
    <div class="tl"><span>🛑 ${t.stop?rs(t.stop):"no stop"}</span><span>entry ${rs(t.entry)}</span><span>🎯 ${rs(hi)}</span></div>
    <div class="row small" style="margin-top:10px;gap:14px"><span>Invested <b>${rs0(t.entry*t.qty)}</b></span><span>Risk <b>${riskRs!=null?rs0(riskRs):"–"}</b></span><span>R:R <b>${rr?rr.toFixed(2):"–"}</b></span></div>
    ${t.notes?`<div class="small muted" style="margin-top:6px">📝 ${esc(t.notes)}</div>`:""}
    ${closing?`<form class="row" style="margin-top:12px" id="closeForm" data-id="${esc(t.id)}"><input name="price" type="number" step="any" min="0" required placeholder="Exit price" value="${ltp?ltp.toFixed(2):""}" style="width:120px">
       <input name="date" type="date" value="${today()}" style="width:150px"><button class="primary sm" type="submit">Close trade</button><button class="sm" type="button" onclick="UI.closing=null;render(true)">Cancel</button></form>`
     :`<div class="row" style="margin-top:12px"><button class="sm primary" data-act="close-trade" data-id="${esc(t.id)}">Close / sell</button><button class="sm" data-act="edit-trade" data-id="${esc(t.id)}">Edit</button><button class="sm danger" data-act="del-trade" data-id="${esc(t.id)}">${ico("x")}Delete</button></div>`}
  </div>`;
}
function pageTrades(q){
  const sm = tradeSummary(), pre = q.get("new"), ed = UI.editing ? Store.state.trades.find(t=>t.id===UI.editing) : null;
  const k = (l,v,s,cls="",g="") => `<div class="card kpi hov ${cls}${g?" clk":""}"${g}><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:""}</div>`;
  const focus = q.get("focus"), cf = q.get("closed");
  const O = go("#/trades?show=open","Show only open trades");
  let h = `<div class="row" style="justify-content:space-between"><div><h1>Trades</h1></div>
    <button class="primary" onclick="document.getElementById('tf').scrollIntoView({behavior:'smooth'});document.querySelector('#tradeForm [name=symbol]').focus()">${ico("plus")}New trade <kbd style="background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.3)">n</kbd></button></div>`;
  h += `<h2>Portfolio summary</h2><div class="g k3">
    ${k(ico("brief")+" Open trades", sm.open.length, `${sm.closed.length} closed`, "gr gr1", O)}
    ${k("Invested amount", rs0(sm.invested), `unrealised ${sm.unreal>=0?"+":""}${rs0(sm.unreal).replace(/<[^>]+>/g,"")}`)}
    ${k("Today's profit", signRs(sm.todayPL), "price move today + trades closed today")}
    ${k("Weekly profit", signRs(sm.week), "realised this week", "", go("#/trades?closed=week","Show trades closed this week"))}
    ${k("Monthly profit", signRs(sm.month), `realised · ${sm.monthBought}/${CFG.goal} trades`, "", go("#/trades?closed=month","Show trades closed this month"))}
    ${k("Yearly profit", signRs(sm.year), "realised this year", "", go("#/trades?closed=year","Show trades closed this year"))}
    ${k("Overall return", pct(sm.overall), "realised + unrealised vs capital used")}
    ${k(ico("shield")+" Portfolio risk", rs0(sm.risk), sm.riskPct==null?"no open trades":`${num(sm.riskPct,1)}% of invested if all stops hit${sm.noStop?` · ${sm.noStop} without stop`:""}`)}
    ${ringKpi("Success ratio", sm.success, "var(--green)", `${sm.wins} of ${sm.closed.length} closed trades won`, go("#/trades?closed=win","Show winning trades"))}</div>`;
  const v = ed || {symbol:pre||"", entry:"", qty:"", target:"", stop:"", date:today(), strategy: pre&&X.vcp?.[pre]?.status ? "VCP" : "Down-streak", notes:""};
  const hint = pre ? (D.stocks[pre]?.status?.best ? `Suggested buy (best tested) ${rs(D.stocks[pre].status.best.buy_price)}` : X.vcp?.[pre]?.pivot ? `VCP pivot ${rs(X.vcp[pre].pivot)}, stop ${rs(X.vcp[pre].stop)}` : "") : "";
  h += `<div class="card" id="tf" style="margin-top:18px"><h3>${ed?"Edit trade":ico("plus")+" New trade"}</h3><form class="form" id="tradeForm">
    <label>Stock<input name="symbol" list="syms" required value="${esc(v.symbol)}" placeholder="e.g. RELIANCE" autocomplete="off"></label>
    <label>Entry price (₹)<input name="entry" type="number" step="any" min="0" required value="${v.entry}"></label>
    <label>Quantity<input name="qty" type="number" step="1" min="1" required value="${v.qty}"></label>
    <label>Target (₹) <a href="#" id="autoT" class="small">+${CFG.target}%</a><input name="target" type="number" step="any" min="0" value="${v.target||""}"></label>
    <label>Stop loss (₹) <a href="#" id="autoS" class="small">suggest</a><input name="stop" type="number" step="any" min="0" value="${v.stop||""}"></label>
    <label>Date<input name="date" type="date" value="${esc(v.date)}"></label>
    <label>Strategy<select name="strategy">${["Down-streak","VCP","Other"].map(s=>`<option ${s===v.strategy?"selected":""}>${s}</option>`).join("")}</select></label>
    <label style="grid-column:span 2">Notes<input name="notes" value="${esc(v.notes||"")}" placeholder="why this trade?"></label>
    <label>&nbsp;<button class="primary" type="submit">${ed?"Save changes":"Add trade"}</button></label></form>
    <div class="calc" id="calc"></div><div class="small muted" style="margin-top:6px">${esc(hint)}${ed?` · <a href="#" onclick="UI.editing=null;render(true);return false">cancel edit</a>`:""}</div></div>`;
  const open = sm.open.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  if(q.get("show")==="open"){
    return h + chip(`Open trades (${open.length})`, "#/trades") + `<div style="height:12px"></div>` +
      (open.length ? `<div class="g cards3">${open.map(tradeCard).join("")}</div>` : `<div class="card empty">No open trades.</div>`);
  }
  h += `<h2 id="openTrades">Open trades <span class="pill FORMING">${open.length}</span></h2>` + (open.length ? `<div class="g cards3">${open.map(tradeCard).join("")}</div>` : `<div class="card empty">No open trades. Add one above, or tap “Trade” next to any stock.</div>`);
  const pl = t => (t.exit_price-t.entry)*t.qty;
  if(focus==="open") scrollToId("openTrades");
  const d0 = today(), wkd = new Date(); wkd.setDate(wkd.getDate()-((wkd.getDay()+6)%7));
  const wkS = `${wkd.getFullYear()}-${String(wkd.getMonth()+1).padStart(2,"0")}-${String(wkd.getDate()).padStart(2,"0")}`;
  const CF = {week:["closed this week",t=>t.exit_date>=wkS], month:["closed this month",t=>t.exit_date>=d0.slice(0,7)+"-01"],
    year:["closed this year",t=>t.exit_date>=d0.slice(0,4)+"-01-01"], win:["winning trades",t=>pl(t)>0], loss:["losing trades",t=>pl(t)<=0], all:["all closed trades",()=>true]};
  let closedRows = sm.closed.slice();
  if(cf && CF[cf]){ closedRows = closedRows.filter(CF[cf][1]); scrollToId("closedTrades"); }
  h += `<h2 id="closedTrades">Closed trades</h2>` + (cf && CF[cf] ? chip(`${CF[cf][0]} (${closedRows.length})`, "#/trades") + `<div style="height:12px"></div>` : "") + grid([
    {h:"#", num:1, v:t=>t.no, f:t=>`<span class="muted">#${t.no??""}</span>`, tip:"Trade number (use it in Telegram commands, e.g. /remove 3)."},
    {h:"Stock", v:t=>t.symbol, f:t=>stockLink(t.symbol, t.strategy)},
    {h:"Bought", v:t=>t.date, f:t=>`${rs(t.entry)}<span class="sub">${esc(t.date)}</span>`},
    {h:"Sold", v:t=>t.exit_date, f:t=>`${rs(t.exit_price)}<span class="sub">${esc(t.exit_date)}</span>`},
    {h:"Qty", num:1, v:t=>t.qty, f:t=>t.qty},
    {h:"Gain", num:1, v:t=>pl(t), f:t=>`${signRs(pl(t))}<span class="sub">${pctTxt((t.exit_price/t.entry-1)*100)}</span>`},
    {h:"Days", num:1, v:t=>holdDays(t), f:t=>holdDays(t)},
    {h:"", f:t=>`<button class="sm danger" data-act="del-trade" data-id="${esc(t.id)}">${ico("x")}</button>`},
  ], closedRows.sort((a,b)=>(b.exit_date||"").localeCompare(a.exit_date||"")), {empty:cf?"No closed trades match.":"No closed trades yet."});
  AFTER.push(() => {
    const f = $("#tradeForm"); if(!f) return;
    const calc = () => { const e=+f.entry.value, n=+f.qty.value, t=+f.target.value, s=+f.stop.value, sym=f.symbol.value.trim().toUpperCase(), q=Q.get(sym);
      const parts=[]; if(q) parts.push(`LTP <b>${rs(q.ltp)}</b>`);
      if(e&&n) parts.push(`Invested <b>${rs0(e*n)}</b>`);
      if(e&&n&&s) parts.push(`Risk <b class="neg">${rs0((e-s)*n)}</b> (${pctTxt((s/e-1)*100)})`);
      if(e&&n&&t) parts.push(`Reward <b class="pos">${rs0((t-e)*n)}</b> (${pctTxt((t/e-1)*100)})`);
      if(e&&s&&t&&e>s) parts.push(`R:R <b>${((t-e)/(e-s)).toFixed(2)}</b>`);
      $("#calc").innerHTML = parts.length ? parts.map(x=>`<span>${x}</span>`).join("") : '<span class="muted">Fill entry and quantity to see invested amount, risk and reward.</span>'; };
    f.addEventListener("input", calc); calc();
    $("#autoT").onclick = e => { e.preventDefault(); if(+f.entry.value) { f.target.value=(+f.entry.value*(1+CFG.target/100)).toFixed(2); calc(); } };
    $("#autoS").onclick = e => { e.preventDefault(); const s=f.symbol.value.trim().toUpperCase(), en=+f.entry.value; const vs=X.vcp?.[s]?.stop;
      f.stop.value = (vs && en && vs<en ? vs : en*0.98).toFixed(2); calc(); toast(vs&&vs<en?"Stop set at the VCP's last pullback low":"Stop set at -2% (your warning level)"); };
    if(pre){ const s=pre; const a=D.stocks[s]; if(a?.status?.best && !f.entry.value){ f.entry.value=a.status.best.buy_price.toFixed(2); f.target.value=(a.status.best.buy_price*(1+CFG.target/100)).toFixed(2); calc(); }
      else if(!f.entry.value){ const q=Q.get(s); if(q){ f.entry.value=q.ltp.toFixed(2); f.target.value=(q.ltp*(1+CFG.target/100)).toFixed(2); calc(); } }
      f.qty.focus(); $("#tf").scrollIntoView({behavior:"smooth", block:"center"}); }
    f.onsubmit = ev => { ev.preventDefault(); document.activeElement?.blur();
      const t = {symbol:f.symbol.value.trim().toUpperCase().replace(/\.NS$/,""), entry:+f.entry.value, qty:Math.round(+f.qty.value),
        target:+f.target.value||null, stop:+f.stop.value||null, date:f.date.value||today(), strategy:f.strategy.value, notes:f.notes.value.trim()};
      if(!t.symbol || !(t.entry>0) || !(t.qty>0)) return toast("Enter stock, entry price and quantity", true);
      if(t.stop && t.stop>=t.entry) return toast("Stop loss should be below the entry price", true);
      if(t.target && t.target<=t.entry) return toast("Target should be above the entry price", true);
      if(ed){ const id=ed.id; UI.editing=null; Store.mutate(s => { Object.assign(s.trades.find(x=>x.id===id), t); }, "Trade updated"); }
      else Store.mutate(s => { s.trades.push({id:uid(), no:Math.max(0,...s.trades.map(x=>x.no||0))+1, ...t, status:"open", exit_price:null, exit_date:null, created:new Date().toISOString()});
        if(!s.watchlist.some(w=>w.symbol===t.symbol)) s.watchlist.push({symbol:t.symbol, added:today(), note:""}); }, `Trade added: ${t.qty} ${t.symbol} @ ₹${t.entry}`);
      if(pre) history.replaceState(null,"","#/trades"); };
    const cf = $("#closeForm"); if(cf){ cf.price.focus(); cf.onsubmit = ev => { ev.preventDefault(); document.activeElement?.blur(); const id=cf.dataset.id, p=+cf.price.value; if(!(p>0)) return toast("Enter the exit price", true);
      UI.closing=null; Store.mutate(s => { const t=s.trades.find(x=>x.id===id); t.status="closed"; t.exit_price=p; t.exit_date=cf.date.value||today(); }, "Trade closed"); }; }
  });
  return h;
}

/* ============================== pages: analytics ============================== */
function pageAnalytics(){
  const st = Store.state, closed = st.trades.filter(t=>t.status==="closed"), pl = t => (t.exit_price-t.entry)*t.qty, rp = t => (t.exit_price/t.entry-1)*100;
  const wins = closed.filter(t=>pl(t)>0), losses = closed.filter(t=>pl(t)<=0);
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const grossW = wins.reduce((a,t)=>a+pl(t),0), grossL = -losses.reduce((a,t)=>a+pl(t),0);
  const months = {}, years = {};
  closed.forEach(t => { const m=(t.exit_date||"").slice(0,7), y=m.slice(0,4); (months[m] ||= {pl:0,n:0,w:0,cap:0}); months[m].pl+=pl(t); months[m].n++; months[m].cap+=t.entry*t.qty; if(pl(t)>0) months[m].w++;
    (years[y] ||= {pl:0,n:0,w:0,cap:0}); years[y].pl+=pl(t); years[y].n++; years[y].cap+=t.entry*t.qty; if(pl(t)>0) years[y].w++; });
  const cap = +st.settings.capital || 0;
  let run = cap; const growth = closed.slice().sort((a,b)=>(a.exit_date||"").localeCompare(b.exit_date||"")).map(t=>{ run+=pl(t); return {x:t.exit_date, y:run}; });
  if(growth.length) growth.unshift({x:"start", y:cap});
  const k = (l,v,s,cls="",g="") => `<div class="card kpi hov ${cls}${g?" clk":""}"${g}><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:""}</div>`;
  const W = go("#/trades?closed=win","Show winning trades"), L = go("#/trades?closed=loss","Show losing trades");
  let h = `<h1>Analytics</h1>`;
  h += `<div class="g k4">${k("Total trades", st.trades.length, `${closed.length} closed · ${st.trades.length-closed.length} open`, "gr gr1")}
    ${k("Winning trades", wins.length, (grossW?"+"+rs0(grossW).replace(/<[^>]+>/g,""):"₹0")+" gross", "gr gr2", W)}${k("Losing trades", losses.length, grossL?"-"+rs0(grossL).replace(/<[^>]+>/g,"")+" gross":"no losses", "gr gr3", L)}
    ${ringKpi("Win rate", closed.length?wins.length/closed.length*100:null, "var(--green)", `profit factor ${grossL?(grossW/grossL).toFixed(2):"–"}`)}
    ${k("Average profit", avg(wins.map(pl))==null?NA:signRs(avg(wins.map(pl))), avg(wins.map(rp))==null?"no winning trades yet":pctTxt(avg(wins.map(rp)))+" per winning trade")}
    ${k("Average loss", avg(losses.map(pl))==null?NA:signRs(avg(losses.map(pl))), avg(losses.map(rp))==null?"no losing trades yet":pctTxt(avg(losses.map(rp)))+" per losing trade")}
    ${k("Average holding", avg(closed.map(holdDays))==null?NA:num(avg(closed.map(holdDays)),1)+" days", "buy to sell")}
    ${k("Total realised", signRs(grossW-grossL), cap?pctTxt((grossW-grossL)/cap*100)+" on starting capital":"set starting capital in Settings")}</div>`;
  const mk = Object.keys(months).sort();
  h += `<div class="g two" style="margin-top:14px"><div class="card"><h3>Monthly returns (₹ realised)${ti("Profit or loss of trades closed in each month.")}</h3>${vbars(mk.map(m=>({label:m.slice(2), value:months[m].pl})),{fmt:v=>(v>=0?"+":"")+nf0.format(v),label:"monthly returns"})}</div>
    <div class="card"><h3>Capital growth${ti("Starting capital (set in Settings) plus each realised profit or loss over time. Without a starting capital it shows cumulative profit.")}</h3>${lineChart([{name:"Capital",color:"var(--green)",pts:growth}],{area:true,fmt:v=>"₹"+nf0.format(v),label:"capital growth"})}</div></div>`;
  h += `<h2>Yearly returns</h2>` + grid([{h:"Year", v:r=>r.y, f:r=>`<b>${esc(r.y)}</b>`}, {h:"Trades", num:1, v:r=>r.n, f:r=>r.n},
    {h:"Win rate", num:1, v:r=>r.w/r.n, f:r=>Math.round(r.w/r.n*100)+"%"}, {h:"Realised", num:1, v:r=>r.pl, f:r=>signRs(r.pl)},
    {h:"Return on capital used", num:1, v:r=>r.pl/r.cap, f:r=>pct(r.pl/r.cap*100)}], Object.entries(years).map(([y,v])=>({y,...v})).sort((a,b)=>b.y.localeCompare(a.y)), {empty:"No closed trades yet."});
  h += `<h2>Monthly detail</h2>` + grid([{h:"Month", v:r=>r.m, f:r=>`<b>${esc(r.m)}</b>`}, {h:"Trades", num:1, v:r=>r.n, f:r=>r.n},
    {h:"Goal", v:r=>r.n, f:r=>`${r.n}/${CFG.goal} ${r.n>=CFG.goal?"✅":""}`}, {h:"Win rate", num:1, v:r=>r.w/r.n, f:r=>Math.round(r.w/r.n*100)+"%"},
    {h:"Realised", num:1, v:r=>r.pl, f:r=>signRs(r.pl)}], mk.reverse().map(m=>({m,...months[m]})), {empty:"No closed trades yet."});
  return h;
}

function priceChart(a){
  const c = a.chart; if(!c || !c.d.length) return `<div class="muted">${esc(a._detErr||"No chart data.")}</div>`;
  const W=860,H=320,L=8,R=64,T=10,B=24, n=c.d.length;
  const st=a.status, lines=[];
  if(st.in_streak){ lines.push({y:st.p0,c:"var(--muted)",l:"P0 "+nf2.format(st.p0),dash:"4 4"}); }
  if(st.best) { lines.push({y:st.best.buy_price,c:"var(--green)",l:"Best "+nf2.format(st.best.buy_price)});
                lines.push({y:st.best.buy_price*(1+CFG.target/100),c:"var(--orange)",l:"Target "+nf2.format(st.best.buy_price*(1+CFG.target/100)),dash:"6 3"}); }
  if(st.your) lines.push({y:st.your.buy_price,c:"var(--blue)",l:"Yours "+nf2.format(st.your.buy_price)});
  const v = X.vcp?.[a.symbol]; if(v?.status) lines.push({y:v.pivot,c:"var(--violet)",l:"VCP pivot "+nf2.format(v.pivot),dash:"2 3"});
  let lo=Math.min(...c.l, ...lines.map(x=>x.y)), hi=Math.max(...c.h, ...lines.map(x=>x.y));
  const pad=(hi-lo)*0.04; lo-=pad; hi+=pad;
  const x=i=>L+(i+0.5)*(W-L-R)/n, y=v=>T+(hi-v)/(hi-lo)*(H-T-B), bw=Math.max(1,(W-L-R)/n*0.6);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Price chart for ${esc(a.symbol)}">`;
  if(st.in_streak){ const i0=c.d.indexOf(st.p0_date); if(i0>=0) s+=`<rect x="${x(i0)}" y="${T}" width="${x(n-1)-x(i0)+bw}" height="${H-T-B}" fill="var(--red)" opacity=".08"/>`; }
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4; s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${W-R+4}" y="${y(v)+4}" font-size="10" fill="var(--muted)">${nf2.format(v)}</text>`; }
  for(let i=0;i<n;i++){ const up=c.c[i]>=c.o[i], col=up?"var(--green)":"var(--red)";
    s+=`<line x1="${x(i)}" x2="${x(i)}" y1="${y(c.h[i])}" y2="${y(c.l[i])}" stroke="${col}"/>`;
    s+=`<rect x="${x(i)-bw/2}" y="${y(Math.max(c.o[i],c.c[i]))}" width="${bw}" height="${Math.max(1,Math.abs(y(c.o[i])-y(c.c[i])))}" fill="${col}"><title>${c.d[i]}  O ${c.o[i]} H ${c.h[i]} L ${c.l[i]} C ${c.c[i]}</title></rect>`; }
  lines.forEach(ln => { s+=`<line x1="${L}" x2="${W-R}" y1="${y(ln.y)}" y2="${y(ln.y)}" stroke="${ln.c}" stroke-width="1.5" ${ln.dash?`stroke-dasharray="${ln.dash}"`:""}/>`; });
  [0, Math.floor(n/3), Math.floor(2*n/3), n-1].forEach(i => s+=`<text x="${x(i)}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="middle">${c.d[i].slice(5)}</text>`);
  s+=`</svg>`;
  const leg = lines.map(ln=>`<span><i style="background:${ln.c}"></i>${esc(ln.l)}</span>`).join("") + (st.in_streak?`<span><i style="background:var(--red);opacity:.3;height:10px"></i>current streak</span>`:"");
  return `<div class="chart">${s}<div class="legend">${leg}</div></div>`;
}
function depthHist(a){
  const d = a.profile.depths_pct||[]; if(!d.length) return `<div class="muted">No meaningful streaks.</div>`;
  const bins={}; d.forEach(v=>{ const b=Math.max(-15,Math.floor(v)); bins[b]=(bins[b]||0)+1; });
  const keys=Object.keys(bins).map(Number).sort((a,b)=>b-a), mx=Math.max(...Object.values(bins));
  const W=420,H=150,B=22,bw=(W-10)/keys.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Depth distribution">`;
  keys.forEach((k,i)=>{ const h=(H-B-14)*bins[k]/mx; const med=a.profile.usual_depth_pct; const isMed = med>=k && med<k+1;
    s+=`<rect x="${5+i*bw+2}" y="${H-B-h}" width="${bw-4}" height="${h}" rx="3" fill="${isMed?"var(--accent)":"var(--muted)"}" opacity="${isMed?1:.45}"><title>${k}% to ${k+1}%: ${bins[k]} streaks</title></rect>`;
    s+=`<text x="${5+i*bw+bw/2}" y="${H-B-h-3}" font-size="10" text-anchor="middle" fill="var(--ink)">${bins[k]}</text>`;
    s+=`<text x="${5+i*bw+bw/2}" y="${H-6}" font-size="10" text-anchor="middle" fill="var(--muted)">${k<=-15?"≤-15":k}</text>`; });
  return s+`</svg>`;
}

  const split = (x,lab) => x ? `<div class="card"><h3>${lab} (${pctTxt(x.level_pct, lab==="Your method"?2:1)})</h3><div class="kv">
    ${Object.entries(x.by_mood||{}).map(([k,v])=>`<div>${esc(k)} market</div><div>${Math.round(v.hit_rate*100)}% of ${v.trades}</div>`).join("")}
    ${Object.entries(x.by_trend||{}).map(([k,v])=>`<div>${esc(k)}</div><div>${Math.round(v.hit_rate*100)}% of ${v.trades}</div>`).join("")}</div></div>` : "";
  h += `<h2>Hit rate by market mood and trend</h2><div class="g two">${split(bt.best,"Best tested")}${split(bt.yours,"Your method")}</div>`;
  if(bt.best_trades) h += `<h2>Last ${(bt.best_trades||[]).length} historical trades (best tested level)</h2>` + grid([
    {h:"Start (P0)", v:t=>t.p0_date, f:t=>esc(t.p0_date)}, {h:"Fill date", v:t=>t.fill_date, f:t=>esc(t.fill_date)},
    {h:"Fill", num:1, v:t=>t.fill, f:t=>rs(t.fill)}, {h:"Hit", v:t=>t.hit?1:0, f:t=>t.hit?"✅":"❌"},
    {h:"Days", num:1, v:t=>t.days_to_target, f:t=>t.days_to_target??""}, {h:"MAE", num:1, v:t=>t.mae, f:t=>pct(t.mae*100)},
    {h:"Result", num:1, v:t=>t.result, f:t=>pct(t.result*100)}, {h:"Mood", v:t=>t.mood, f:t=>esc(t.mood)}, {h:"Trend", v:t=>t.trend, f:t=>esc(t.trend)},
  ], [...(bt.best_trades||[])].reverse(), {empty:"No trades at the best tested level."});
  const mv=a.mover;
  h += `<h2>Daily mover (your old sheet)${ti("Share of days the level was reached from the open, over the last "+mv.days+" days.")}</h2><p class="small muted" style="margin-top:-6px">Average daily range ${num(mv.avg_range_pct,2)}% · mover score ${num(a.mover_score,0)}/100</p>`;
  h += `<div class="tw"><table><thead><tr>${Object.keys(mv.down_hits).map(k=>`<th class="num">-${k}%</th>`).join("")}${Object.keys(mv.up_hits).map(k=>`<th class="num">+${k}%</th>`).join("")}</tr></thead><tbody><tr>${Object.values(mv.down_hits).map(v=>`<td class="num">${v.toFixed(0)}%</td>`).join("")}${Object.values(mv.up_hits).map(v=>`<td class="num">${v.toFixed(0)}%</td>`).join("")}</tr></tbody></table></div>`;
  if(a.sheet?.length){
    const lv = Object.keys(a.sheet[0]).filter(k=>/^[+-]\d/.test(k));
    h += `<details><summary>Day-by-day table (last ${a.sheet.length} days)</summary><div class="tw"><table><thead><tr><th>Date</th><th class="num">Open</th><th class="num">High</th><th class="num">Low</th><th class="num">Close</th><th class="num">CHG%</th><th class="num">LOW DIFF%</th><th class="num">HIGH DIFF%</th><th class="num">DAY DIFF%</th>${lv.map(k=>`<th class="num">${esc(k)}</th>`).join("")}</tr></thead><tbody>${
      [...a.sheet].reverse().map(r=>`<tr><td>${esc(r.Date)}</td><td class="num">${nf2.format(r.Open)}</td><td class="num">${nf2.format(r.High)}</td><td class="num">${nf2.format(r.Low)}</td><td class="num">${nf2.format(r.Close)}</td><td class="num">${pct(r["CHG%"])}</td><td class="num">${pct(r["LOW DIFF%"])}</td><td class="num">${pct(r["HIGH DIFF%"])}</td><td class="num">${num(r["DAY DIFF%"],2)}%</td>${lv.map(k=>r[k]?`<td class="hit">●</td>`:`<td class="miss">·</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;
  }
  const flag = (cond, html) => cond ? `<span class="red">${html}</span>` : html;
  const c = CFG.fund;
  h += `<h2>Fundamentals</h2><div class="g two"><div class="card"><div class="kv">
    <div>Market cap</div><div>${crore(f.market_cap)}</div>
    <div>P/E vs industry</div><div>${num(f.pe,1)} vs ${num(a.industry_pe,1)}</div>
    <div>EPS</div><div>${flag(f.eps<0, f.eps==null?NA:rs(f.eps))}</div>
    <div>ROE</div><div>${flag(f.roe!=null&&f.roe<c.min_roe_pct, f.roe==null?NA:f.roe.toFixed(1)+"%")}</div>
    <div>Debt / equity</div><div>${flag(f.debt_to_equity>c.max_debt_to_equity && !a.grade.financial, f.debt_to_equity==null?NA:f.debt_to_equity.toFixed(2))}${a.grade.financial?' <span class="sub">not used for financials</span>':""}</div>
    <div>Revenue growth</div><div>${flag(f.revenue_growth<c.min_revenue_growth_pct, f.revenue_growth==null?NA:pctTxt(f.revenue_growth,1))}</div>
    <div>Profit growth</div><div>${flag(f.earnings_growth<c.min_earnings_growth_pct, f.earnings_growth==null?NA:pctTxt(f.earnings_growth,1))}</div>
    <div>Profit margin</div><div>${flag(f.profit_margin<0, f.profit_margin==null?NA:f.profit_margin.toFixed(1)+"%")}</div>
    <div>Dividend yield</div><div>${f.dividend_yield==null?NA:f.dividend_yield.toFixed(2)+"%"}</div>
  </div></div><div class="card"><div class="kv">
    <div>Promoter</div><div>${sh.promoter==null?NA:sh.promoter.toFixed(2)+"%"} ${sh.promoter_chg!=null?`<span class="sub">${pctTxt(sh.promoter_chg)} pts QoQ</span>`:""}</div>
    <div>Promoter pledge</div><div>${flag(sh.pledge>c.max_pledge_pct||sh.pledge_chg>0, sh.pledge==null?NA:sh.pledge.toFixed(2)+"%")} ${sh.pledge_chg!=null?`<span class="sub">${pctTxt(sh.pledge_chg)} pts</span>`:""}</div>
    <div>FII</div><div>${sh.fii==null?NA:sh.fii.toFixed(2)+"%"} ${sh.fii_chg!=null?`<span class="sub">${pctTxt(sh.fii_chg)} pts QoQ</span>`:""}</div>
    <div>DII</div><div>${sh.dii==null?NA:sh.dii.toFixed(2)+"%"} ${sh.dii_chg!=null?`<span class="sub">${pctTxt(sh.dii_chg)} pts QoQ</span>`:""}</div>
    <div>Shareholding quarter</div><div>${esc(sh.quarter||"N/A")}</div>
    <div>Next results</div><div>${esc(f.earnings_date||"N/A")}</div>
    <div>Ex-dividend</div><div>${esc(f.ex_dividend_date||"N/A")}</div>
    <div>Liquidity (60d)</div><div>₹${num(a.liquidity_crore,0)} cr / day</div>
  </div></div></div>`;
  const nw = a.news;
  h += `<h2>News (last ${CFG.news_days} days)</h2>`;
  if(!nw || !nw.headlines) h += `<div class="card muted">${nw?.negative?.length?`${nw.negative.length} negative item(s) found. `:""}${esc(a._detErr || "News is checked only for READY, GETTING CLOSE and deep-fall stocks.")}</div>`;
  else {
    const item = n => `<li style="margin:8px 0">${n.matches?.length?"🔴 ":""}<span class="muted small">${esc(n.date)} · ${esc(n.source)}</span><br><a href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>${n.matches?.length?` <span class="red small">(${n.matches.map(esc).join(", ")})</span>`:""}</li>`;
    h += `<div class="g two"><div class="card"><h3>Headlines (${nw.headlines.length})</h3><ul style="padding-left:16px;margin:0">${nw.headlines.slice(0,25).map(item).join("")||'<li class="muted">None found.</li>'}</ul></div>
      <div class="card"><h3>NSE announcements (${nw.announcements.length})</h3><ul style="padding-left:16px;margin:0">${nw.announcements.map(n=>item({...n,title:n.title+(n.text?": "+n.text:"")})).join("")||'<li class="muted">None.</li>'}</ul></div></div>`;
  }
  return h;
}

/* ============================== boot ============================== */
async function start(){
  if(!P.locked){ D = P.data; return boot(); }
  let saved = null; try { saved = sessionStorage.getItem("sp_pw"); } catch(e) {}
  if(saved){ try { D = await decrypt(P.env, saved); PW = saved; return boot(); } catch(e) {} }
  $("#lock").hidden = false;
  $("#lockform").onsubmit = async ev => {
    ev.preventDefault(); $("#lockerr").textContent = "Unlocking…";
    try { const pw=$("#pw").value; D = await decrypt(P.env, pw); PW = pw;
      try { sessionStorage.setItem("sp_pw", pw); } catch(e) {}
      $("#lock").hidden = true; boot();
    } catch(e) { $("#lockerr").textContent = "Wrong password."; }
  };
}
async function boot(){
  CFG = D.cfg; X = D.extras || {};
  const all = new Set([...Object.keys(D.stocks), ...Object.keys(X.vcp||{})]);
  $("#syms").innerHTML = [...all].map(s=>`<option value="${esc(s)}">${esc(nameOf(s))}</option>`).join("");
  $("#foot").innerHTML = `For analysis only, not investment advice. · Data date ${esc(D.data_date||"N/A")} · built ${esc(D.generated||"")} · ${D.movers} fast movers analysed, ${Object.keys(X.vcp||{}).length} liquid stocks scanned for VCP, out of ${D.universe} NSE stocks. Prices from Yahoo (end of day; live ~15-min delayed only via the local server).`;
  await Store.init();
  window.addEventListener("hashchange", () => render());
  render();
  refreshLive(); setInterval(refreshLive, 60000);
}
/* theme + shortcuts */
(function(){
  let t=null; try{ t=localStorage.getItem("sp_theme"); }catch(e){}
  if(t) document.documentElement.dataset.theme=t;
  const flip = () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const n = dark?"light":"dark"; document.documentElement.dataset.theme=n; try{ localStorage.setItem("sp_theme",n);}catch(e){} };
  $("#theme").onclick = flip;
  let g=false, gt=0;
  document.addEventListener("keydown", e => {
    if(e.target.matches("input,select,textarea")){ if(e.key==="Escape") e.target.blur(); return; }
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key==="?"){ $("#help").hidden=!$("#help").hidden; return; }
    if(e.key==="Escape"){ $("#help").hidden=true; return; }
    if(g){ g=false; const m={d:"/",i:"/industries",m:"/global",w:"/watchlist",t:"/trades",a:"/analytics"}[e.key]; if(m) location.hash="#"+m; return; }
    if(e.key==="g"){ g=true; clearTimeout(gt); gt=setTimeout(()=>g=false,1200); return; }
    if(e.key==="t") flip();
    if(e.key==="n"){ location.hash="#/trades"; setTimeout(()=>document.querySelector("#tradeForm [name=symbol]")?.focus(),80); }
  });
})();
start();
